name: test and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # pins src/pf.js to the output recorded from the Julia-validated pf.py
      - run: node --test test/pf.test.mjs

  publish:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # the two listings stand in for the directory listing a static host has
      # no way to give; regenerating them here means they cannot go stale
      - run: python3 tools/make_index.py
      - name: assemble the site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r src cases coord vendor _site/
      # enablement turns Pages on for the repo if it is off, so a fresh clone
      # or fork publishes without anyone visiting Settings first
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
